<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        button {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #005f8a;
        }
    </style>
</head>
<body>
    <h1>Select a Model</h1>
    <button onclick="selectModel('Model A')">Select Model A</button>
    <button onclick="selectModel('Model B')">Select Model B</button>

    <script>
        const tg = window.Telegram.WebApp;

        if (tg.initDataUnsafe) {
            tg.ready();
            tg.expand();
            console.log("Telegram Web App is ready!");
        } else {
            alert("Please open this app through Telegram.");
        }

        function selectModel(model) {
            tg.sendData(JSON.stringify({ selected_model: model })); // Sends data back to your bot
            alert(`You selected: ${model}`); // Just for quick feedback
        }
    </script>
</body>
</html>
