<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Model</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            display: block;
            width: 100%;
        }
        button:hover {
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Select a Model</h1>
    <p>Choose a character persona to chat with:</p>
    <button onclick="selectModel('Model 1: The Scientist')">Model 1: The Scientist</button>
    <button onclick="selectModel('Model 2: The Philosopher')">Model 2: The Philosopher</button>
    <button onclick="selectModel('Model 3: The Adventurer')">Model 3: The Adventurer</button>
    <button onclick="selectModel('Model 4: The Artist')">Model 4: The Artist</button>

    <p id="status"></p>

    <script>
        const status = document.getElementById('status');

        // Ensure Telegram Web App API is available
        function initTelegramWebApp() {
            console.log('Checking Telegram Web App API...');

            if (window.Telegram && Telegram.WebApp) {
                console.log('✅ Telegram Web App API is available:', Telegram.WebApp);
                Telegram.WebApp.ready();
                status.textContent = '✅ Telegram Web App API is ready!';
                Telegram.WebApp.showAlert('Web App API is working!');
                return true;
            } else {
                console.log('❌ Telegram Web App API is NOT available.');
                status.textContent = '❌ Telegram Web App API is NOT available. Please open this app through Telegram.';
                alert('Please open this app through Telegram.');
                return false;
            }
        }

        // Send selected model data to the bot
        function selectModel(model) {
            console.log('Selected model:', model);

            if (initTelegramWebApp()) {
                try {
                    const data = JSON.stringify({ model: model });
                    console.log('Sending data to Telegram:', data);
                    Telegram.WebApp.sendData(data);
                    Telegram.WebApp.close();
                } catch (error) {
                    console.error('❌ Failed to send data:', error);
                    alert('Failed to send data to Telegram.');
                }
            }
        }

        // Debug logs
        console.log('window.Telegram:', window.Telegram); // Should not be undefined
        if (window.Telegram) {
            console.log('Telegram.WebApp:', Telegram.WebApp); // Should show WebApp object
        }

        // Ensure Telegram Web App API is ready when the page loads
        document.addEventListener('DOMContentLoaded', initTelegramWebApp);
    </script>
</body>
</html>
