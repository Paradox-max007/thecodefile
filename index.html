<!DOCTYPE html>
<html>
<head>
    <title>Model Selector</title>
</head>
<body>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;

        if (tg.initDataUnsafe) {
            tg.ready();
            tg.expand();
            console.log("Telegram Web App is ready!");
        } else {
            alert("Please open this app through Telegram.");
        }

        function selectModel(model) {
            const data = JSON.stringify({ selected_model: model });
            tg.sendData(data); // Sends data back to the Telegram bot
            tg.close(); // Closes the Web App after sending data
        }
    </script>

    <button onclick="selectModel('Model A')">Select Model A</button>
    <button onclick="selectModel('Model B')">Select Model B</button>
    <button onclick="selectModel('Model C')">Select Model C</button>
    <button onclick="selectModel('Model D')">Select Model D</button>
</body>
</html>
