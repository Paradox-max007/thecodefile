<!DOCTYPE html>
<html>
<head>
    <title>Select AI Model</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        button { margin: 10px; padding: 10px 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Choose Your AI Model</h1>
    <button onclick="selectModel('Friendly AI')">Friendly AI</button>
    <button onclick="selectModel('Professional AI')">Professional AI</button>
    <button onclick="selectModel('Creative AI')">Creative AI</button>
    <button onclick="selectModel('Sarcastic AI')">Sarcastic AI</button>

    <h2>Upgrade for Deep Conversations</h2>
    <button onclick="subscribe('monthly')">Monthly Plan - $10</button>
    <button onclick="subscribe('yearly')">Yearly Plan - $100</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function selectModel(model) {
            tg.sendData(JSON.stringify({ action: 'select_model', model: model }));
            tg.close();
        }

        function subscribe(plan) {
            tg.sendData(JSON.stringify({ action: 'subscribe', plan: plan }));
            tg.close();
        }
    </script>
</body>
</html>
