<!DOCTYPE html>
<html>
<head>
    <title>Select a Model</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 10px 20px; margin: 10px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Select a Model</h1>
    <button onclick="selectModel('Model A')">Model A</button>
    <button onclick="selectModel('Model B')">Model B</button>
    <button onclick="selectModel('Model C')">Model C</button>
    <button onclick="selectModel('Model D')">Model D</button>

    <script>
        const tg = window.Telegram.WebApp;

        if (tg.initDataUnsafe) {
            tg.ready();
            tg.expand();
            console.log("Telegram Web App is ready!");
        } else {
            alert("Please open this app through Telegram.");
        }

        function selectModel(model) {
            const data = JSON.stringify({ model: model });
            tg.sendData(data); // This sends data back to your Telegram bot
            tg.close(); // Closes the Web App after selecting the model
        }
    </script>
</body>
</html>
