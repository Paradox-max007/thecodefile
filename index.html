<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Model</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 10px;
            display: block;
            width: 100%;
        }
        button:hover {
            cursor: pointer
        }
    </style>
</head>
<body>
    <h1>Select a Model</h1>
    <p>Choose a character persona to chat with:</p>
    <button onclick="selectModel('Model 1: The Scientist')">Model 1: The Scientist</button>
    <button onclick="selectModel('Model 2: The Philosopher')">Model 2: The Philosopher</button>
    <button onclick="selectModel('Model 3: The Adventurer')">Model 3: The Adventurer</button>
    <button onclick="selectModel('Model 4: The Artist')">Model 4: The Artist</button>

    <script>
        // Initialize the Telegram Web App API
        function initTelegramWebApp() {
            if (window.Telegram && Telegram.WebApp) {
                console.log("Telegram Web App API is available.");
                console.log("WebApp version:", Telegram.WebApp.version);
                console.log("WebApp platform:", Telegram.WebApp.platform);
                Telegram.WebApp.ready(); // Notify Telegram that the app is ready
                return true;
            } else {
                console.log("Telegram Web App API is NOT available.");
                return false;
            }
        }

        // Function to send the selected model back to the bot
        function selectModel(model) {
            console.log("Selected model:", model);
            if (initTelegramWebApp()) {
                console.log("Sending data to the bot...");
                // Send the selected model to the bot
                Telegram.WebApp.sendData(JSON.stringify({ model: selectedModel }));

                // Close the mini app
                Telegram.WebApp.close();
            } else {
                alert("This app is not running in Telegram.");
            }
        }

        // Initialize the API when the page loads
        initTelegramWebApp();
    </script>
</body>
</html>
